name: Build APK Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK Release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kas-condo-release
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Get version
        id: version
        run: echo "version=$(node -e "console.log(require('./app.json').expo.version)")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: KAS Condomínio v${{ steps.version.outputs.version }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false
          overwrite: true
          body: |
            Versão ${{ steps.version.outputs.version }} do app KAS Condomínio.

            **Novidades:**
            - SIP corrigido (porta 7040)
            - Auto-update melhorado
            - Notificações FCM integradas
            - Download direto pelo app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to VPS
        if: always() && steps.find_apk.outputs.apk_path != ''
        env:
          VPS_HOST: 104.234.200.93
          VPS_USER: root
          VPS_PASS: ${{ secrets.VPS_PASS }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get install -y sshpass
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          sshpass -p "$VPS_PASS" scp -o StrictHostKeyChecking=no \
            "$APK" "$VPS_USER@$VPS_HOST:/opt/kas-condo-api/apk/kas-condo-latest.apk"
          sshpass -p "$VPS_PASS" ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "echo '{\"version\":\"$APP_VERSION\",\"download_url\":\"/admin/download/app\"}' > /opt/kas-condo-api/apk/version.json"
          echo "APK $APP_VERSION enviado para o servidor!"
