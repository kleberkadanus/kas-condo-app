name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate placeholder assets
        run: |
          python3 - <<'EOF'
          import struct, zlib, os
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          def png(w, h, r=27, g=79, b=138):
              row = b'\x00' + bytes([r, g, b]) * w
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(row * h, 1))
                      + chunk(b'IEND', b''))
          os.makedirs('assets', exist_ok=True)
          for name, w, h in [('icon',1024,1024),('adaptive-icon',1024,1024),('splash',1242,2688),('favicon',32,32)]:
              open(f'assets/{name}.png','wb').write(png(w,h))
              print(f'Created assets/{name}.png')
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Install RN bundler CLI
        run: npm install --no-save @react-native-community/cli

      - name: Configure gradle.properties
        run: |
          echo "BUNDLE_IN_DEBUG=true" >> android/gradle.properties

      - name: Bundle JS manually
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache
          echo "Bundle OK: $(du -sh android/app/src/main/assets/index.android.bundle)"

      - name: List app Gradle tasks (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:tasks --all 2>&1 | grep -iE "bundle|codegen|generate|js|node|schema" | head -40 || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log; exit ${PIPESTATUS[0]}
        env:
          JAVA_OPTS: "-Xmx4096m"
        continue-on-error: true

      - name: Show build failure details
        if: always()
        run: |
          echo "=== FAILURE SECTION ==="
          grep -A 20 "What went wrong" /tmp/gradle-build.log || true
          echo "=== TASKS SECTION ==="
          grep -E "^> Task|FAILED|SKIPPED|UP-TO-DATE" /tmp/gradle-build.log | tail -30 || true
          echo "=== NODE ERROR ==="
          grep -B 5 -A 10 "non-zero exit value\|node.*error\|SyntaxError" /tmp/gradle-build.log || true

      - name: Fail if build failed
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kas-condo-app-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: KAS Condominio ${{ github.ref_name }}
          body: |
            ## KAS Condominio App ${{ github.ref_name }}

            ### Instalacao
            1. Baixe o arquivo `app-debug.apk`
            2. No celular: Configuracoes -> Seguranca -> Instalar apps desconhecidos -> Permitir
            3. Abra o APK e instale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
