name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate placeholder assets
        run: |
          mkdir -p assets
          convert -size 1024x1024 xc:"#1B4F8A" assets/icon.png
          convert -size 1024x1024 xc:"#1B4F8A" assets/adaptive-icon.png
          convert -size 1242x2688 xc:"#1B4F8A" assets/splash.png
          convert -size 32x32 xc:"#1B4F8A" assets/favicon.png

      - name: Install dependencies
        run: npm ci

      - name: Install react-native-sip2 (Linux)
        run: npm install react-native-sip2 --save 2>/dev/null || echo "SIP module optional"

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_OPTS: "-Xmx4096m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kas-condo-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: KAS Condominio ${{ github.ref_name }}
          body: |
            ## KAS Condominio App ${{ github.ref_name }}

            ### Instalacao
            1. Baixe o arquivo `app-debug.apk`
            2. No celular: Configuracoes -> Seguranca -> Instalar apps desconhecidos -> Permitir
            3. Abra o APK e instale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
