name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate placeholder assets
        run: |
          python3 - <<'EOF'
          import struct, zlib, os
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          def png(w, h, r=27, g=79, b=138):
              row = b'\x00' + bytes([r, g, b]) * w
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(row * h, 1))
                      + chunk(b'IEND', b''))
          os.makedirs('assets', exist_ok=True)
          for name, w, h in [('icon',1024,1024),('adaptive-icon',1024,1024),('splash',1242,2688),('favicon',32,32)]:
              open(f'assets/{name}.png','wb').write(png(w,h))
              print(f'Created assets/{name}.png')
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Patch react-native-sip2 for Android 12+
        run: |
          python3 - <<'PYEOF'
          import glob, re

          files = glob.glob('node_modules/react-native-sip2/**/*.java', recursive=True)
          print(f'Found {len(files)} Java files in react-native-sip2')

          for path in files:
              content = open(path).read()
              if 'registerReceiver' not in content:
                  continue

              print(f'\n=== {path} ===')
              for i, line in enumerate(content.split('\n'), 1):
                  if 'registerReceiver' in line:
                      print(f'  BEFORE line {i}: {line.rstrip()}')

              # Replace any 2-arg registerReceiver(a, b); with if-else block.
              # Java ternary cannot be a standalone statement, so we must use if-else.
              # Pattern captures: optional "obj." prefix + "registerReceiver" as group 1,
              # first arg as group 2, second arg as group 3, and the semicolon.
              def fix(m):
                  if 'RECEIVER_NOT_EXPORTED' in m.group(0) or 'RECEIVER_EXPORTED' in m.group(0):
                      return m.group(0)
                  call = m.group(1)  # e.g. "context.registerReceiver" or "registerReceiver"
                  a, b = m.group(2), m.group(3)
                  return (
                      f'if (android.os.Build.VERSION.SDK_INT >= 26) {{\n'
                      f'    {call}({a}, {b}, android.content.Context.RECEIVER_NOT_EXPORTED);\n'
                      f'}} else {{\n'
                      f'    {call}({a}, {b});\n'
                      f'}}'
                  )

              patched = re.sub(
                  r'((?:[\w.()]+\.)?registerReceiver)\((\w+),\s*([\w.()]+)\);',
                  fix,
                  content
              )

              if patched != content:
                  open(path, 'w').write(patched)
                  print(f'  -> PATCHED')
                  for i, line in enumerate(patched.split('\n'), 1):
                      if 'registerReceiver' in line or 'Build.VERSION' in line:
                          print(f'  AFTER  line {i}: {line.rstrip()}')
              else:
                  print(f'  -> no 2-arg pattern matched, dumping lines 14-22:')
                  for i, line in enumerate(content.split('\n')[13:22], 14):
                      print(f'    {i}: {line.rstrip()}')
          PYEOF

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Link react-native-sip2 and patch AndroidManifest
        run: |
          python3 - <<'PYEOF'
          import glob, re, os

          # 1. Verify PJSIP libs were downloaded by libs.sh (postinstall)
          sip2_root = 'node_modules/react-native-sip2'
          native_files = (
              glob.glob(f'{sip2_root}/**/*.so', recursive=True) +
              glob.glob(f'{sip2_root}/**/*.jar', recursive=True) +
              glob.glob(f'{sip2_root}/android/libs/**', recursive=True)
          )
          print(f'PJSIP native files found: {len(native_files)}')
          for f in native_files[:10]:
              print(f'  {f}')

          # 2. Patch android/settings.gradle — add react-native-sip2 project if autolinking missed it
          settings_path = 'android/settings.gradle'
          if os.path.exists(settings_path):
              settings = open(settings_path).read()
              if ':react-native-sip2' not in settings:
                  with open(settings_path, 'a') as f:
                      f.write('\ninclude ":react-native-sip2"\n')
                      f.write('project(":react-native-sip2").projectDir = '
                              'new File(rootProject.projectDir, "../node_modules/react-native-sip2/android")\n')
                  print('settings.gradle: react-native-sip2 added')
              else:
                  print('settings.gradle: already included (autolinking worked!)')
          else:
              print('settings.gradle: NOT FOUND')

          # 3. Patch android/app/build.gradle — add dependency if autolinking missed it
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              content = open(app_gradle).read()
              if 'react-native-sip2' not in content:
                  content = re.sub(
                      r'(dependencies\s*\{)',
                      r'\1\n    implementation project(":react-native-sip2")',
                      content, count=1
                  )
                  open(app_gradle, 'w').write(content)
                  print('app/build.gradle: dependency added')
              else:
                  print('app/build.gradle: already has dependency (autolinking worked!)')
          else:
              print('app/build.gradle: NOT FOUND')

          # 4. Patch MainApplication.kt — add PjSipModulePackage if not already there
          for path in glob.glob('android/app/src/main/java/**/*.kt', recursive=True):
              if 'MainApplication' not in path:
                  continue
              content = open(path).read()
              print(f'MainApplication: {path}')
              if 'PjSipModulePackage' in content:
                  print('  PjSipModulePackage already present (autolinking worked!)')
                  continue
              # Add import — insert after last expo import line
              if 'import expo.modules.ReactNativeHostWrapper' in content:
                  content = content.replace(
                      'import expo.modules.ReactNativeHostWrapper',
                      'import expo.modules.ReactNativeHostWrapper\nimport one.telefon.sip2.PjSipModulePackage'
                  )
              elif 'import expo.modules' in content:
                  # fallback: add after first expo.modules import
                  content = re.sub(
                      r'(import expo\.modules\.[^\n]+\n)',
                      r'\1import one.telefon.sip2.PjSipModulePackage\n',
                      content, count=1
                  )
              # Add package to getPackages()
              if 'val packages = PackageList(this).packages' in content:
                  content = content.replace(
                      'val packages = PackageList(this).packages',
                      'val packages = PackageList(this).packages\n            packages.add(PjSipModulePackage())'
                  )
                  open(path, 'w').write(content)
                  print(f'  PjSipModulePackage added')
              else:
                  print(f'  WARNING: could not find PackageList pattern, dumping content snippet:')
                  idx = content.find('getPackages')
                  if idx >= 0:
                      print(content[max(0,idx-50):idx+200])

          # 5. Patch AndroidManifest.xml — add PjSipService declaration (REQUIRED)
          for manifest_path in glob.glob('android/app/src/main/AndroidManifest.xml'):
              content = open(manifest_path).read()
              if 'PjSipService' not in content:
                  sip_entries = (
                      '\n        <!-- PjSip service -->\n'
                      '        <service\n'
                      '            android:name="one.telefon.sip2.PjSipService"\n'
                      '            android:enabled="true"\n'
                      '            android:exported="false" />\n'
                      '        <receiver\n'
                      '            android:name="one.telefon.sip2.PjSipConnectivityReceiver"\n'
                      '            android:exported="true">\n'
                      '            <intent-filter>\n'
                      '                <action android:name="android.net.conn.CONNECTIVITY_CHANGE" />\n'
                      '            </intent-filter>\n'
                      '        </receiver>\n'
                      '        <!-- PjSip end -->'
                  )
                  content = content.replace('</application>', sip_entries + '\n    </application>')
                  open(manifest_path, 'w').write(content)
                  print(f'{manifest_path}: PjSipService + PjSipConnectivityReceiver added')
              else:
                  print(f'{manifest_path}: PjSipService already present')
          PYEOF

      - name: Configure Firebase (google-services.json)
        run: |
          cp google-services.json android/app/google-services.json
          echo "google-services.json configurado"

      - name: Configure signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/kas-debug.keystore
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          android.signingConfigs {
              kasDebug {
                  storeFile file('kas-debug.keystore')
                  storePassword "$System.env.KEYSTORE_PASS"
                  keyAlias "$System.env.KEY_ALIAS"
                  keyPassword "$System.env.KEY_PASS"
                  storeType 'PKCS12'
              }
          }
          android.buildTypes.debug.signingConfig = android.signingConfigs.kasDebug
          GRADLE_EOF
          echo "Keystore configurada"
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Test autolinking before any changes
        run: |
          node node_modules/expo-modules-autolinking/build/index.js resolve-modules-list --platform android --search-paths . 2>&1 | head -30 || true

      - name: Bundle JS via expo export:embed
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res 2>&1
          echo "Bundle size: $(du -sh android/app/src/main/assets/index.android.bundle 2>/dev/null || echo 'not found')"

      - name: Test autolinking after expo export:embed
        run: |
          node node_modules/expo-modules-autolinking/build/index.js resolve-modules-list --platform android --search-paths . 2>&1 | head -20 || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1
        env:
          JAVA_OPTS: "-Xmx4096m"
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kas-condo-app-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: KAS Condominio ${{ github.ref_name }}
          body: |
            ## KAS Condominio App ${{ github.ref_name }}

            ### Instalacao
            1. Baixe o arquivo `app-debug.apk`
            2. No celular: Configuracoes -> Seguranca -> Instalar apps desconhecidos -> Permitir
            3. Abra o APK e instale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
