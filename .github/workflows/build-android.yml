name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (standalone)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate placeholder assets
        run: |
          python3 - <<'EOF'
          import struct, zlib, os
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          def png(w, h, r=27, g=79, b=138):
              row = b'\x00' + bytes([r, g, b]) * w
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(row * h, 1))
                      + chunk(b'IEND', b''))
          os.makedirs('assets', exist_ok=True)
          for name, w, h in [('icon',1024,1024),('adaptive-icon',1024,1024),('splash',1242,2688),('favicon',32,32)]:
              open(f'assets/{name}.png','wb').write(png(w,h))
              print(f'Created assets/{name}.png')
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Patch react-native-sip2 for Android 12+
        run: |
          python3 - <<'PYEOF'
          import glob, os, re

          files = glob.glob('node_modules/react-native-sip2/**/*.java', recursive=True)
          print(f'Found {len(files)} Java files in react-native-sip2')

          for path in files:
              content = open(path).read()
              if 'registerReceiver' not in content:
                  continue

              print(f'\n=== {path} ===')
              for i, line in enumerate(content.split('\n'), 1):
                  if 'registerReceiver' in line:
                      print(f'  line {i}: {line.strip()}')

              # Replace: .registerReceiver(a, b) -> API-aware version (no flag yet = 2 args)
              # Match any 2-arg registerReceiver call not already having 3 args with flag
              def fix_receiver(m):
                  full = m.group(0)
                  if 'RECEIVER_NOT_EXPORTED' in full or 'RECEIVER_EXPORTED' in full:
                      return full  # already patched
                  obj = m.group(1)   # context or this
                  a   = m.group(2)   # receiver arg
                  b   = m.group(3)   # filter arg
                  return (
                      f'(android.os.Build.VERSION.SDK_INT >= 26 ? '
                      f'{obj}.registerReceiver({a}, {b}, android.content.Context.RECEIVER_NOT_EXPORTED) : '
                      f'{obj}.registerReceiver({a}, {b}))'
                  )

              # Pattern: captures obj.registerReceiver(arg1, arg2)
              patched = re.sub(
                  r'([\w.()]+)\.registerReceiver\((\w+),\s*(\w+)\)',
                  fix_receiver,
                  content
              )

              if patched != content:
                  open(path, 'w').write(patched)
                  print(f'  -> PATCHED')
              else:
                  print(f'  -> no simple pattern matched, trying broader fix')
                  # Fallback: just add the flag as 3rd arg to any 2-arg registerReceiver
                  patched2 = re.sub(
                      r'registerReceiver\(([^,)]+),\s*([^,)]+)\)(?!\s*,)',
                      lambda m: (
                          f'registerReceiver({m.group(1)}, {m.group(2)}, android.content.Context.RECEIVER_NOT_EXPORTED)'
                          if 'RECEIVER_NOT_EXPORTED' not in m.group(0) else m.group(0)
                      ),
                      content
                  )
                  if patched2 != content:
                      open(path, 'w').write(patched2)
                      print(f'  -> PATCHED (fallback)')
          PYEOF

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Test autolinking before any changes
        run: |
          node node_modules/expo-modules-autolinking/build/index.js resolve-modules-list --platform android --search-paths . 2>&1 | head -30 || true

      - name: Bundle JS via expo export:embed
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res 2>&1
          echo "Bundle size: $(du -sh android/app/src/main/assets/index.android.bundle 2>/dev/null || echo 'not found')"

      - name: Test autolinking after expo export:embed
        run: |
          node node_modules/expo-modules-autolinking/build/index.js resolve-modules-list --platform android --search-paths . 2>&1 | head -20 || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1
        env:
          JAVA_OPTS: "-Xmx4096m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kas-condo-app-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: KAS Condominio ${{ github.ref_name }}
          body: |
            ## KAS Condominio App ${{ github.ref_name }}

            ### Instalacao
            1. Baixe o arquivo `app-debug.apk`
            2. No celular: Configuracoes -> Seguranca -> Instalar apps desconhecidos -> Permitir
            3. Abra o APK e instale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
